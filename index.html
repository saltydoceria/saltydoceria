<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salty Doceria</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

    <style>
        /* CONFIGURAÇÕES GERAIS */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #fff0f0; 
            color: #4A3B32; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* CONTAINER PRINCIPAL */
        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            text-align: center;
        }

        /* IMAGEM DE PERFIL/LOGO */
        .profile-img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        /* TÍTULO COM A NOVA FONTE */
        h1 { 
            font-family: 'Pacifico', cursive;
            font-size: 38px;
            margin-bottom: 5px;
            color: #d61c1c;
            font-weight: normal;
        }

        p { color: #eb2525; margin-bottom: 30px; font-size: 14px; }

        /* ESTILO DOS BOTÕES */
        .link-btn {
            display: block;
            background-color: #fff;
            color: #af1919;
            text-decoration: none;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 30px; 
            border: 1px solid #f82121;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer; /* Garante que pareça clicável */
        }

        /* EFEITO AO PASSAR O MOUSE/TOCAR */
        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            background-color: #FAF4EB;
        }

        /* BOTÃO DE DESTAQUE (WHATSAPP) */
        .highlight {
            background-color: #fc1313; 
            color: white;
            border: none;
        }
        .highlight:hover { background-color: #cf6283; color: white; }

        /* --- NOVO: ESTILO DO BOTÃO PIX --- */
        .btn-pix {
            background-color: #32BCAD; /* Verde Pix oficial */
            color: #ffffff;
            border: none;
        }
        .btn-pix:hover, .btn-pix:active { 
            background-color: #27968a; /* Verde um pouco mais escuro no clique */
            color: #ffffff;
            background-color: #27968a !important; /* Força a cor verde no hover */
        }

        /* RODAPÉ */
        footer {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logosalty.jpg" alt="Logo Salty" class="profile-img">
        
        <h1>Salty Doceria</h1>
        <p>Bolos artesanais, doces finos e muito amor. 🍰</p>

        <a href="https://wa.me/+5582994169255" class="link-btn highlight">
            📲 Entre em contato (WhatsApp)

        </a>
        
        <a href="pedido.html" class="link-btn">
            🛒 Faça sua encomenda/pedido 
        </a>

        <a href="CÁRDAPIO DE BOLOS SALTY - 202601.pdf" class="link-btn">
            🎂 Ver Cardápio Completo (PDF)
        </a>

        <a href="https://maps.app.goo.gl/BMkzFQLu1YFLKGsw6" class="link-btn">
            📍 Como Chegar (Maps)
        </a>

        <a href="#" class="link-btn btn-pix" onclick="event.preventDefault(); navigator.clipboard.writeText('82994169255'); alert('✅ Chave Pix Copiada com Sucesso!\n\nCelular: 82994169255\n\nAgora é só abrir o app do seu banco e colar.');">
             💠 Chave Pix (Copia e Cola)
        </a>

        <footer>
            © 2025 Salty Doceria
        </footer>
    </div>

</body>

</html>
